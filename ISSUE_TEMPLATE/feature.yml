name: "🚀 Feature request"
description: Ask for a new flag, command or behaviour.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example step
      description: How you'd like to write the step.
      render: yaml
      placeholder: |
        - setup-go:
            with:
              version-file: go.mod
  - type: input
    id: equivalent
    attributes:
      label: Orb or GitHub Action that does this
      description: Optional. Many functions port an orb, so a link helps.
